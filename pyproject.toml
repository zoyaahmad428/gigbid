[project]
name = "gigbid-student-project"
version = "0.1.0"
description = "Student scaffold for the AI-4016 GigBid assignment"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.7",
  "uvicorn[standard]==0.54.0",
  "pydantic",
  "pyyaml",
  "langgraph",
  "langchain",
  "langchain-mcp-adapters",
  "mcp==2.3.0",
  "httpx",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff", "mypy", "httpx==0.28.1"]
# data/pipeline: builds the GigSim dataset from Kaggle sources (make data)
data = [
  "kaggle==2.2.5",
  "pandas==3.1.1",
  "numpy==2.5.4",
  "pyarrow==26.0.1",
  "openpyxl==3.1.5",
  "pydantic==2.14.3",
  "PyYAML==6.0.3",
  "reportlab==5.1.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
