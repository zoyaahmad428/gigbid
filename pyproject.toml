[project]
name = "gigbid-student-project"
version = "0.1.0"
description = "Student scaffold for the AI-4016 GigBid assignment"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pyyaml",
  "langgraph",
  "langchain",
  "langchain-mcp-adapters",
  "mcp",
  "httpx",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]
# data/pipeline: builds the GigSim dataset from Kaggle sources (make data)
data = [
  "kaggle==2.2.5",
  "pandas==3.1.1",
  "numpy==2.5.4",
  "pyarrow==26.0.1",
  "openpyxl==3.1.5",
  "pydantic==2.14.3",
  "PyYAML==6.0.3",
  "reportlab==5.1.0",
]

[tool.ruff]
line-length = 100
