[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gigbid-student-project"
version = "0.1.0"
description = "Student scaffold for the AI-4016 GigBid assignment"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.7",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "mcp==2.3.0",
  # agents (step 4)
  "langgraph==1.2.22",
  "langgraph-checkpoint==4.3.2",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langchain-core==1.8.0",
  "aiosqlite==0.22.1",
  "openai==3.51.0",
  # retrieval (step 3): CPU ONNX embeddings + cross-encoder
  "fastembed==0.9.1",
  "onnxruntime==1.32.0",
  "numpy==2.5.4",
  # ops (step 6): Postgres checkpointer and memory store, Arq worker on Redis
  "langgraph-checkpoint-postgres==3.2.1",
  "psycopg[binary]==3.3.9",
  "psycopg-pool==3.3.3",
  "arq==0.28.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.15.4", "mypy"]
# data/pipeline: builds the GigSim dataset from Kaggle sources (make data)
data = [
  "kaggle==2.2.5",
  "pandas==3.1.1",
  "numpy==2.5.4",
  "pyarrow==26.0.1",
  "openpyxl==3.1.5",
  "pydantic==2.14.3",
  "PyYAML==6.0.3",
  "reportlab==5.1.0",
]

[tool.setuptools.packages.find]
include = ["agent*", "apps*", "rag*", "mcp_servers*", "gigsim*", "worker*", "evals*"]

[tool.ruff]
line-length = 100
# data/personas/*/repos is portfolio sample code the agents retrieve, not project code
extend-exclude = ["data/personas", "apps/web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
